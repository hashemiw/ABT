name: abt
x-app: &app
  build: .
  environment: &environment
    DATABASE_URL: postgres://abt:abt_local_only@db:5432/abt?sslmode=disable
    HTTP_ADDR: :8080
    DB_MAX_CONNS: ${DB_MAX_CONNS:-5}
    DB_TIMEOUT: ${DB_TIMEOUT:-3s}
    SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT:-10s}
    AI_PROVIDER: ${AI_PROVIDER:-mock}
    ENABLE_REAL_AI_CALLS: ${ENABLE_REAL_AI_CALLS:-false}
    ALLOW_PAID_AI_CALLS: ${ALLOW_PAID_AI_CALLS:-false}
    WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-1}
  stop_grace_period: 15s
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: abt
      POSTGRES_PASSWORD: abt_local_only
      POSTGRES_DB: abt
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U abt -d abt"]
      interval: 2s
      timeout: 3s
      retries: 20
  migrate:
    <<: *app
    command: ["/app/migrate"]
    depends_on:
      db:
        condition: service_healthy
  api:
    <<: *app
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health/ready"]
      interval: 5s
      timeout: 4s
      retries: 10
  worker:
    <<: *app
    command: ["/app/worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
volumes:
  postgres_data:
