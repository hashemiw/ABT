name: abt
x-app: &app
  build: .
  environment: &environment
    DATABASE_URL: postgres://abt:abt_local_only@db:5432/abt?sslmode=disable
    HTTP_ADDR: :8080
    DB_MAX_CONNS: ${DB_MAX_CONNS:-5}
    DB_TIMEOUT: ${DB_TIMEOUT:-3s}
    SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT:-10s}
    AI_PROVIDER: ${AI_PROVIDER:-mock}
    ENABLE_REAL_AI_CALLS: ${ENABLE_REAL_AI_CALLS:-false}
    ALLOW_PAID_AI_CALLS: ${ALLOW_PAID_AI_CALLS:-false}
    WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-1}
    STORAGE_ENDPOINT: http://storage:9000
    # Host baked into signed URLs: must be reachable by the client (simulator/device), not the compose network.
    STORAGE_PUBLIC_ENDPOINT: ${STORAGE_PUBLIC_ENDPOINT:-http://127.0.0.1:9000}
    STORAGE_BUCKET: abt-private
    STORAGE_ACCESS_KEY: abtlocal
    STORAGE_SECRET_KEY: abtlocal_secret_only
    STORAGE_ENSURE_BUCKET: "true"
    MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-10485760}
  stop_grace_period: 15s
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: abt
      POSTGRES_PASSWORD: abt_local_only
      POSTGRES_DB: abt
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U abt -d abt"]
      interval: 2s
      timeout: 3s
      retries: 20
  storage:
    # Local S3-compatible store (pinned by digest). Development credentials only; never published beyond loopback.
    image: chrislusf/seaweedfs@sha256:c2658820e763294a9e9de7b36c81e59b879e3459148351aee4e31a126ca64860
    command: ["server", "-dir=/data", "-filer", "-s3", "-s3.port=9000", "-volume.max=64", "-master.volumeSizeLimitMB=128"]
    environment:
      AWS_ACCESS_KEY_ID: abtlocal
      AWS_SECRET_ACCESS_KEY: abtlocal_secret_only
    ports:
      - "127.0.0.1:${STORAGE_PORT:-9000}:9000"
    volumes:
      - storage_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 9000"]
      interval: 3s
      timeout: 3s
      retries: 30
  migrate:
    <<: *app
    command: ["/app/migrate"]
    depends_on:
      db:
        condition: service_healthy
      storage:
        condition: service_healthy
  api:
    <<: *app
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health/ready"]
      interval: 5s
      timeout: 4s
      retries: 10
  worker:
    <<: *app
    command: ["/app/worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
volumes:
  postgres_data:
  storage_data:
